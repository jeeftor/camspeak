name: SBOM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.2
      - name: Generate SPDX SBOM
        run: trivy fs --format spdx-json --output sbom.spdx.json .

      - name: Generate CycloneDX SBOM
        run: trivy fs --format cyclonedx --output sbom.cyclonedx.json .

      - name: Upload SPDX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 90

      - name: Upload CycloneDX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-json
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Attach SBOMs to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom.spdx.json
            sbom.cyclonedx.json
